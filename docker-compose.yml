services:
  netcheck-backend:
    build:
      context: ./backend
    container_name: netcheck-backend
    environment:
      NETCHECK_DATABASE_URL: sqlite:////app/data/netcheck.db
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data
      - report_data:/app/reports
      - backend_logs:/app/logs
    cap_add:
      - NET_RAW
    networks:
      - netcheck-lab

  # 可选：MySQL 部署示例。默认使用 SQLite；启用 MySQL 时把 backend 的
  # NETCHECK_DATABASE_URL 改为 mysql+pymysql://netcheck:netcheck@netcheck-mysql:3306/netcheck?charset=utf8mb4
  # netcheck-mysql:
  #   image: mysql:8.4
  #   container_name: netcheck-mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: netcheck
  #     MYSQL_DATABASE: netcheck
  #     MYSQL_USER: netcheck
  #     MYSQL_PASSWORD: netcheck
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - netcheck-lab

  netcheck-frontend:
    build:
      context: ./frontend
    container_name: netcheck-frontend
    depends_on:
      - netcheck-backend
    ports:
      - "8080:80"
    networks:
      - netcheck-lab

  demo-web-ok:
    image: nginx:1.27-alpine
    container_name: demo-web-ok
    volumes:
      - ./demo-services/web-ok/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "18080:80"
    networks:
      - netcheck-lab

  demo-web-error:
    image: nginx:1.27-alpine
    container_name: demo-web-error
    volumes:
      - ./demo-services/web-error/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18081:80"
    networks:
      - netcheck-lab

  demo-web-slow:
    build:
      context: ./demo-services/web-slow
    container_name: demo-web-slow
    ports:
      - "18082:80"
    networks:
      - netcheck-lab

  # ---- 演示可观测性栈：Prometheus 抓取 /metrics + Grafana 仪表盘 ----
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: netcheck-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - netcheck-backend
    networks:
      - netcheck-lab

  grafana:
    image: grafana/grafana:11.1.0
    container_name: netcheck-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - netcheck-lab

networks:
  netcheck-lab:
    name: netcheck-lab

volumes:
  db_data:
  report_data:
  backend_logs:
  prometheus_data:
  grafana_data:
  # mysql_data:
