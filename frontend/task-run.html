<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>任务运行详情 - 自动化巡检与故障诊断平台</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" /><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" /><link href="css/app.css" rel="stylesheet" /></head>
<body><div id="app-nav"></div><main class="container-fluid app-main"><div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3"><div><a class="small text-muted" href="tasks.html"><i class="bi bi-arrow-left"></i> 返回巡检任务</a><h4 class="mb-0 mt-1"><i class="bi bi-activity me-1"></i>任务运行详情</h4></div><button class="btn btn-outline-secondary btn-sm" id="btn-refresh"><i class="bi bi-arrow-clockwise me-1"></i>刷新</button></div><div id="page-error" class="alert alert-danger d-none" role="alert"></div><div id="run-summary" class="row g-3 mb-3"><div class="col-12 text-muted">加载中...</div></div><div class="card mb-3"><div class="card-header">运行记录</div><div class="card-body"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>运行 ID</th><th>状态</th><th>开始时间</th><th>结束时间</th><th>错误信息</th><th class="text-end">操作</th></tr></thead><tbody id="runs-tbody"><tr><td colspan="6" class="text-center text-muted py-4">加载中...</td></tr></tbody></table></div><div class="pagination-bar mt-3"><div class="text-muted small" id="runs-page-info">共 0 条</div><div class="btn-group btn-group-sm"><button class="btn btn-outline-secondary" id="runs-prev" disabled>上一页</button><button class="btn btn-outline-secondary" id="runs-next" disabled>下一页</button></div></div></div></div><div class="card"><div class="card-header d-flex justify-content-between align-items-center"><span>运行结果 <span class="text-muted small" id="current-run-text"></span></span><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary d-none" id="open-diagnosis">查看本次诊断</a><a class="btn btn-sm btn-outline-primary d-none" id="open-results">查看独立结果页</a></div></div><div class="card-body"><div id="results-placeholder" class="text-muted">请从上方选择一条运行记录查看结果。</div><div id="results-content" class="d-none"><form id="result-filter" class="row g-2 align-items-end mb-3"><div class="col-md-3"><label class="form-label small" for="rf-type">检测类型</label><select id="rf-type" class="form-select form-select-sm"><option value="">全部</option><option value="ping">Ping</option><option value="port">端口</option><option value="http">HTTP</option></select></div><div class="col-md-3"><label class="form-label small" for="rf-status">结果状态</label><select id="rf-status" class="form-select form-select-sm"><option value="">全部</option><option value="success">成功</option><option value="warning">警告</option><option value="failed">失败</option></select></div><div class="col-md-3"><button class="btn btn-primary btn-sm" type="submit">筛选</button><button class="btn btn-outline-secondary btn-sm ms-1" type="button" id="result-reset">重置</button></div></form><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>资产</th><th>类型</th><th>状态</th><th>耗时</th><th>消息 / 错误</th><th>检测时间</th><th class="text-end">操作</th></tr></thead><tbody id="result-tbody"></tbody></table></div><div class="pagination-bar mt-3"><div class="text-muted small" id="result-page-info">共 0 条</div><div class="btn-group btn-group-sm"><button class="btn btn-outline-secondary" id="result-prev">上一页</button><button class="btn btn-outline-secondary" id="result-next">下一页</button></div></div></div></div></div></main><div class="modal fade" id="detailModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">结果详情</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><dl class="row mb-0" id="detail-content"></dl></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/ws.js"></script><script src="js/task-run.js"></script></body></html>
