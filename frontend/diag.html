<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>网络诊断 - 自动化巡检与故障诊断平台</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" /><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" /><link href="css/app.css" rel="stylesheet" /></head><body><div id="app-nav"></div><main class="container-fluid app-main"><div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3"><div><h4 class="mb-0"><i class="bi bi-signpost-split me-1"></i>网络诊断</h4><div class="text-muted small">Traceroute 路径探查：定位链路中断点与延迟分布</div></div></div><div class="card mb-3"><div class="card-body"><div class="row g-2 align-items-end"><div class="col-md-5"><label class="form-label small" for="diag-target">目标（IP 或主机名）</label><input class="form-control" id="diag-target" placeholder="例如：10.0.0.1 或 8.8.8.8" /></div><div class="col-md-2"><label class="form-label small" for="diag-hops">最大跳数</label><input class="form-control" type="number" id="diag-hops" value="15" min="1" max="64" /></div><div class="col-md-3"><button class="btn btn-primary w-100" id="btn-run"><span class="spinner-border spinner-border-sm me-1 d-none" id="run-spin"></span><i class="bi bi-play-fill me-1"></i>开始诊断</button></div><div class="col-md-2 text-end"><a class="btn btn-outline-secondary w-100" href="discovery.html"><i class="bi bi-radar me-1"></i>资产发现</a></div></div></div></div><div id="page-error" class="alert alert-danger d-none" role="alert"></div><div class="card"><div class="card-body"><div id="result-placeholder" class="text-muted">输入目标后点击「开始诊断」。运行时请保持网络稳定，耗时约 1~30 秒。</div><div id="result-content" class="d-none"><div class="alert alert-info py-2" id="result-summary"></div><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>跳数</th><th>主机</th><th>IP</th><th>RTT1</th><th>RTT2</th><th>RTT3</th></tr></thead><tbody id="hops-tbody"></tbody></table></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/diag.js"></script></body></html>
