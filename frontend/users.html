<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>用户管理 - 自动化巡检与故障诊断平台</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" /><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" /><link href="css/app.css" rel="stylesheet" /></head><body><div id="app-nav"></div><main class="container-fluid app-main"><div class="d-flex flex-wrap align-items-center justify-content-between mb-3"><div><h4 class="mb-0"><i class="bi bi-people me-1"></i>用户管理</h4><div class="text-muted small">管理员可创建账号、分配角色（admin / operator / viewer）与停用账号</div></div><div class="d-flex gap-2"><input class="form-control form-control-sm" id="f-username" placeholder="按用户名筛选" style="width: 160px" /><button class="btn btn-outline-secondary btn-sm" id="btn-refresh"><i class="bi bi-arrow-clockwise me-1"></i>刷新</button><button class="btn btn-primary btn-sm" id="btn-create"><i class="bi bi-plus-lg me-1"></i>新建用户</button></div></div><div id="page-error" class="alert alert-danger d-none" role="alert"></div><div class="card"><div class="card-body"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>最后登录</th><th>创建时间</th><th class="text-end">操作</th></tr></thead><tbody id="users-tbody"><tr><td colspan="7" class="text-center text-muted py-4">加载中...</td></tr></tbody></table></div><div class="pagination-bar mt-3"><div class="text-muted small" id="page-info">共 0 条</div><div class="btn-group btn-group-sm"><button class="btn btn-outline-secondary" id="btn-prev" disabled>上一页</button><button class="btn btn-outline-secondary" id="btn-next" disabled>下一页</button></div></div></div></div></main><div class="modal fade" id="userModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="userModalLabel">新建用户</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div id="form-error" class="alert alert-danger d-none" role="alert"></div><div class="mb-3"><label class="form-label">用户名<span class="required-mark">*</span></label><input class="form-control" id="u-username" maxlength="64" placeholder="字母数字下划线" /></div><div class="mb-3"><label class="form-label">初始密码<span class="required-mark">*</span></label><input class="form-control" id="u-password" type="text" placeholder="至少 8 位（编辑时留空表示不修改）" /><div class="form-text">建议使用字母+数字+符号组合。</div></div><div class="mb-3"><label class="form-label">角色</label><select class="form-select" id="u-role"><option value="operator">运维操作员（可读写资产/任务/报告）</option><option value="admin">管理员（全部权限）</option><option value="viewer">只读观察员（仅查看）</option></select></div><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="u-active" checked /><label class="form-check-label" for="u-active">账号启用（可登录）</label></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" id="btn-save"><span class="spinner-border spinner-border-sm me-1 d-none" id="save-spin"></span><span id="save-text">保存</span></button></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/users.js"></script></body></html>
