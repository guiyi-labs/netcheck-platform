<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>报告管理 - 自动化巡检与故障诊断平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
</head>
<body>
  <div id="app-nav"></div>
  <main class="container-fluid app-main reports-page">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div><h4 class="mb-0"><i class="bi bi-file-earmark-spreadsheet me-1"></i>报告管理</h4><div class="text-muted small">生成、下载和维护巡检报告</div></div>
      <button class="btn btn-outline-secondary btn-sm" id="btn-refresh" type="button"><i class="bi bi-arrow-clockwise me-1"></i>刷新</button>
    </div>
    <div id="page-error" class="alert alert-danger d-none" role="alert"></div>
    <div id="page-success" class="alert alert-success d-none" role="alert"></div>

    <div class="row g-3 mb-3">
      <div class="col-lg-6"><div class="card report-panel h-100"><div class="card-header">生成运行报告</div><div class="card-body"><form id="run-report-form" class="row g-2 align-items-end"><div class="col-sm-8"><label class="form-label" for="run-id">运行 ID</label><input class="form-control" id="run-id" type="number" min="1" required placeholder="输入 run_id" /></div><div class="col-sm-4"><button class="btn btn-primary w-100" type="submit"><i class="bi bi-file-plus me-1"></i>生成</button></div></form></div></div></div>
      <div class="col-lg-6"><div class="card report-panel h-100"><div class="card-header">生成日报</div><div class="card-body"><form id="daily-report-form" class="row g-2 align-items-end"><div class="col-sm-8"><label class="form-label" for="report-date">报告日期</label><input class="form-control" id="report-date" type="date" required /></div><div class="col-sm-4"><button class="btn btn-primary w-100" type="submit"><i class="bi bi-file-plus me-1"></i>生成</button></div></form></div></div></div>
    </div>

    <div class="card filter-card mb-3"><div class="card-body"><form id="filter-form" class="row g-2 align-items-end"><div class="col-md-3"><label class="form-label" for="f-report-type">报告类型</label><select class="form-select" id="f-report-type"><option value="">全部</option><option value="run">运行报告</option><option value="daily">日报</option></select></div><div class="col-md-4 d-flex gap-2"><button class="btn btn-primary" type="submit"><i class="bi bi-funnel me-1"></i>筛选</button><button class="btn btn-outline-secondary" id="btn-reset" type="button">重置</button></div></form></div></div>

    <div class="card"><div class="card-body"><div class="table-responsive"><table class="table table-hover align-middle mb-0 report-table"><thead><tr><th>ID</th><th>报告名称</th><th>类型</th><th>报告日期</th><th>运行/任务</th><th>文件</th><th>大小</th><th>生成时间</th><th class="text-end">操作</th></tr></thead><tbody id="reports-tbody"><tr><td colspan="9" class="text-center text-muted py-4">加载中...</td></tr></tbody></table></div><div class="pagination-bar mt-3"><div class="text-muted small" id="page-info">共 0 条</div><div class="btn-group btn-group-sm"><button class="btn btn-outline-secondary" id="btn-prev" disabled>上一页</button><button class="btn btn-outline-secondary" id="btn-next" disabled>下一页</button></div></div></div></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/reports.js"></script>
</body></html>
