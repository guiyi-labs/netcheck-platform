<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>巡检结果 - 自动化巡检与故障诊断平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
</head>
<body>
  <div id="app-nav"></div>
  <main class="container-fluid app-main">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h4 class="mb-0"><i class="bi bi-clipboard-data me-1"></i>巡检结果</h4>
        <div class="text-muted small" id="run-caption">全局结果查询</div>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-outline-primary btn-sm d-none" id="open-diagnosis"><i class="bi bi-tools me-1"></i>查看本次诊断</a>
        <button class="btn btn-outline-secondary btn-sm" id="btn-refresh" type="button"><i class="bi bi-arrow-clockwise me-1"></i>刷新</button>
      </div>
    </div>
    <div id="page-error" class="alert alert-danger d-none" role="alert"></div>
    <div class="card filter-card mb-3"><div class="card-body"><form id="filter-form" class="row g-2 align-items-end">
      <div class="col-md-2"><label class="form-label" for="f-run-id">运行 ID</label><input class="form-control" id="f-run-id" type="number" min="1" placeholder="run_id" /></div>
      <div class="col-md-2"><label class="form-label" for="f-task-id">任务 ID</label><input class="form-control" id="f-task-id" type="number" min="1" placeholder="task_id" /></div>
      <div class="col-md-2"><label class="form-label" for="f-asset-id">资产 ID</label><input class="form-control" id="f-asset-id" type="number" min="1" placeholder="asset_id" /></div>
      <div class="col-md-2"><label class="form-label" for="f-type">检测类型</label><select class="form-select" id="f-type"><option value="">全部</option><option value="ping">Ping</option><option value="port">端口</option><option value="http">HTTP</option></select></div>
      <div class="col-md-2"><label class="form-label" for="f-status">结果状态</label><select class="form-select" id="f-status"><option value="">全部</option><option value="success">成功</option><option value="warning">警告</option><option value="failed">失败</option></select></div>
      <div class="col-md-2"><label class="form-label" for="f-start-date">开始日期</label><input class="form-control" id="f-start-date" type="date" /></div>
      <div class="col-md-2"><label class="form-label" for="f-end-date">结束日期</label><input class="form-control" id="f-end-date" type="date" /></div>
      <div class="col-md-4 d-flex gap-2"><button class="btn btn-primary" type="submit"><i class="bi bi-funnel me-1"></i>查询</button><button class="btn btn-outline-secondary" type="button" id="btn-reset">重置</button></div>
    </form></div></div>
    <div class="card"><div class="card-body"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
      <thead><tr><th>ID</th><th>运行/任务</th><th>资产</th><th>检测类型</th><th>目标</th><th>状态</th><th>耗时</th><th>消息 / 错误</th><th>检测时间</th><th class="text-end">操作</th></tr></thead>
      <tbody id="results-tbody"><tr><td colspan="10" class="text-center text-muted py-4">加载中...</td></tr></tbody>
    </table></div><div class="pagination-bar mt-3"><div class="text-muted small" id="page-info">共 0 条</div><div class="btn-group btn-group-sm"><button class="btn btn-outline-secondary" id="btn-prev" disabled>上一页</button><button class="btn btn-outline-secondary" id="btn-next" disabled>下一页</button></div></div></div></div>
  </main>
  <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailModalLabel" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="detailModalLabel">结果详情</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div><div class="modal-body"><dl class="row mb-0" id="detail-content"></dl></div></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/results.js"></script>
</body></html>
