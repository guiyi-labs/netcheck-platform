<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>审计日志 - 自动化巡检与故障诊断平台</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" /><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" /><link href="css/app.css" rel="stylesheet" /></head><body><div id="app-nav"></div><main class="container-fluid app-main"><div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3"><div><h4 class="mb-0"><i class="bi bi-journal-text me-1"></i>审计日志</h4><div class="text-muted small">用户关键操作记录与追溯</div></div><button class="btn btn-outline-secondary btn-sm" id="btn-refresh"><i class="bi bi-arrow-clockwise me-1"></i>刷新</button></div><div id="page-error" class="alert alert-danger d-none" role="alert"></div><div class="card mb-3"><div class="card-body"><form id="filter-form" class="row g-2 align-items-end"><div class="col-md-2"><label class="form-label small" for="f-user">操作用户</label><input class="form-control form-control-sm" id="f-user" placeholder="用户名" /></div><div class="col-md-2"><label class="form-label small" for="f-action">动作</label><input class="form-control form-control-sm" id="f-action" placeholder="如 task.create" /></div><div class="col-md-2"><label class="form-label small" for="f-target">对象类型</label><input class="form-control form-control-sm" id="f-target" placeholder="如 asset" /></div><div class="col-md-2"><label class="form-label small" for="f-start">起始日期</label><input type="date" class="form-control form-control-sm" id="f-start" /></div><div class="col-md-2"><label class="form-label small" for="f-end">截止日期</label><input type="date" class="form-control form-control-sm" id="f-end" /></div><div class="col-md-2 text-end"><button class="btn btn-primary btn-sm w-100" type="submit"><i class="bi bi-search me-1"></i>查询</button></div></form></div></div><div class="card"><div class="card-body"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>时间</th><th>用户</th><th>动作</th><th>对象类型</th><th>对象 ID</th><th>详情</th><th>来源 IP</th></tr></thead><tbody id="logs-tbody"><tr><td colspan="7" class="text-center text-muted py-4">加载中...</td></tr></tbody></table></div><div class="pagination-bar mt-3"><div class="text-muted small" id="page-info">共 0 条</div><div class="btn-group btn-group-sm"><button class="btn btn-outline-secondary" id="btn-prev" disabled>上一页</button><button class="btn btn-outline-secondary" id="btn-next" disabled>下一页</button></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/audit.js"></script></body></html>
