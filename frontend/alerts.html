<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>告警中心 - 自动化巡检与故障诊断平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app-nav"></div>

    <main class="container-fluid app-main alerts-page">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <div>
          <h4 class="mb-0"><i class="bi bi-bell me-1"></i>告警中心</h4>
          <div class="text-muted small">告警监控、确认恢复与策略配置闭环</div>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-2">
          <span class="text-muted small" id="alerts-updated">--</span>
          <button class="btn btn-outline-secondary btn-sm" id="btn-refresh" type="button">
            <i class="bi bi-arrow-clockwise me-1"></i>刷新
          </button>
        </div>
      </div>

      <div id="page-error" class="alert alert-danger d-none" role="alert"></div>
      <div id="page-success" class="alert alert-success d-none" role="alert"></div>

      <div class="row g-3 mb-3 dashboard-stats">
        <div class="col-6 col-lg-3">
          <div class="stat-card"><div class="stat-icon alert-stat-active"><i class="bi bi-exclamation-triangle"></i></div><div><div class="stat-label">活跃告警</div><div class="stat-value text-danger" id="stat-active-alerts">--</div></div></div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card"><div class="stat-icon alert-stat-unconfirmed"><i class="bi bi-bell"></i></div><div><div class="stat-label">未确认</div><div class="stat-value text-warning-emphasis" id="stat-unconfirmed-alerts">--</div></div></div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card"><div class="stat-icon alert-stat-recovered"><i class="bi bi-check2-circle"></i></div><div><div class="stat-label">今日恢复</div><div class="stat-value text-success" id="stat-recovered-alerts-today">--</div></div></div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card"><div class="stat-icon"><i class="bi bi-list-ul"></i></div><div><div class="stat-label">总数</div><div class="stat-value" id="stat-total-alerts">--</div></div></div>
        </div>
      </div>

      <div class="card policy-card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
          <button class="btn btn-link p-0 text-decoration-none fw-semibold" type="button" data-bs-toggle="collapse" data-bs-target="#policyCollapse" aria-expanded="false" aria-controls="policyCollapse">
            <i class="bi bi-sliders me-1"></i>告警策略配置
          </button>
          <span class="small text-muted" id="policy-status">未加载</span>
        </div>
        <div id="policyCollapse" class="collapse">
          <div class="card-body">
            <form id="policy-form" class="row g-3">
              <div class="col-12 col-md-4 col-xl-3">
                <label class="form-label" for="policy-name">策略名称</label>
                <input class="form-control" id="policy-name" type="text" maxlength="100" />
              </div>
              <div class="col-6 col-md-4 col-xl-2">
                <label class="form-label" for="policy-slow-response">慢响应阈值</label>
                <input class="form-control" id="policy-slow-response" type="number" min="0" step="1" />
              </div>
              <div class="col-6 col-md-4 col-xl-2">
                <label class="form-label" for="policy-failure">失败阈值</label>
                <input class="form-control" id="policy-failure" type="number" min="0" step="1" />
              </div>
              <div class="col-6 col-md-4 col-xl-2">
                <label class="form-label" for="policy-recovery">恢复阈值</label>
                <input class="form-control" id="policy-recovery" type="number" min="0" step="1" />
              </div>
              <div class="col-12 col-md-8 col-xl-3 d-flex align-items-end gap-3">
                <div class="form-check form-switch mb-2">
                  <input class="form-check-input" id="policy-enabled" type="checkbox" />
                  <label class="form-check-label" for="policy-enabled">启用</label>
                </div>
                <div class="form-check form-switch mb-2">
                  <input class="form-check-input" id="policy-deduplicate" type="checkbox" />
                  <label class="form-check-label" for="policy-deduplicate">去重</label>
                </div>
              </div>
              <div class="col-12 d-flex justify-content-end gap-2">
                <button class="btn btn-outline-secondary" id="btn-policy-reload" type="button">重新读取</button>
                <button class="btn btn-primary" id="btn-policy-save" type="submit">保存策略</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="card filter-card mb-3">
        <div class="card-body">
          <form id="filter-form" class="row g-2 align-items-end">
            <div class="col-6 col-md-2">
              <label class="form-label" for="f-status">状态</label>
              <select class="form-select" id="f-status">
                <option value="">全部</option>
                <option value="active">活跃</option>
                <option value="confirmed">已确认</option>
                <option value="recovered">已恢复</option>
              </select>
            </div>
            <div class="col-6 col-md-2">
              <label class="form-label" for="f-level">等级</label>
              <select class="form-select" id="f-level">
                <option value="">全部</option>
                <option value="critical">严重</option>
                <option value="major">重要</option>
                <option value="warning">警告</option>
                <option value="minor">轻微</option>
              </select>
            </div>
            <div class="col-6 col-md-2">
              <label class="form-label" for="f-asset-id">资产 ID</label>
              <input class="form-control" id="f-asset-id" type="number" min="1" />
            </div>
            <div class="col-6 col-md-2">
              <label class="form-label" for="f-check-type">检测类型</label>
              <input class="form-control" id="f-check-type" type="text" placeholder="ping/http/port" />
            </div>
            <div class="col-6 col-md-2">
              <label class="form-label" for="f-fault-type">故障类型</label>
              <input class="form-control" id="f-fault-type" type="text" />
            </div>
            <div class="col-6 col-md-2 d-flex gap-2">
              <button class="btn btn-primary flex-fill" type="submit">筛选</button>
              <button class="btn btn-outline-secondary" id="btn-reset" type="button">重置</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>告警列表</span>
          <span class="small text-muted" id="page-info">--</span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 alert-table">
              <thead><tr><th>ID</th><th>标题</th><th>等级</th><th>状态</th><th>资产</th><th>检测/故障</th><th>触发</th><th>最近触发</th><th class="text-end">操作</th></tr></thead>
              <tbody id="alerts-tbody"><tr><td colspan="9" class="text-center text-muted py-4">加载中...</td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="card-footer pagination-bar">
          <div class="small text-muted">每页 20 条</div>
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary" id="btn-prev" type="button">上一页</button>
            <button class="btn btn-outline-secondary" id="btn-next" type="button">下一页</button>
          </div>
        </div>
      </div>
    </main>

    <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">告警详情</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
          </div>
          <div class="modal-body">
            <div id="detail-error" class="alert alert-danger d-none"></div>
            <div id="detail-loading" class="text-center text-muted py-4 d-none">加载中...</div>
            <dl class="row mb-0" id="detail-content"></dl>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">关闭</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/alerts.js"></script>
  </body>
</html>
