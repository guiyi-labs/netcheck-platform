<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>逻辑拓扑 - 自动化巡检与故障诊断平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
</head>
<body>
  <div id="app-nav"></div>
  <main class="container-fluid app-main topology-page">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <div>
        <h4 class="mb-0"><i class="bi bi-diagram-3 me-1"></i>逻辑拓扑</h4>
        <div class="text-muted small">展示核心网络与资产节点关系</div>
      </div>
      <button class="btn btn-outline-secondary btn-sm" id="btn-refresh-topology" type="button"><i class="bi bi-arrow-clockwise me-1"></i>刷新拓扑</button>
    </div>
    <div id="topology-error" class="alert alert-danger d-none" role="alert"></div>
    <div class="row g-3">
      <div class="col-12 col-xl-9">
        <div class="card h-100"><div class="card-header d-flex flex-wrap justify-content-between gap-2"><span>网络拓扑图</span><div class="topology-legend"><span><i class="legend-dot bg-primary"></i>核心</span><span><i class="legend-dot legend-online"></i>在线</span><span><i class="legend-dot legend-warning"></i>告警</span><span><i class="legend-dot legend-offline"></i>离线</span><span><i class="legend-dot legend-unknown"></i>未知</span></div></div><div class="card-body"><div id="topology-chart" class="topology-chart"></div><div id="topology-fallback" class="chart-fallback d-none"></div></div></div>
      </div>
      <div class="col-12 col-xl-3">
        <div class="card h-100"><div class="card-header">节点详情</div><div class="card-body"><div id="node-detail" class="node-detail empty-state"><i class="bi bi-cursor"></i><div>点击拓扑节点查看详情</div></div></div></div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/topology.js"></script>
</body>
</html>
