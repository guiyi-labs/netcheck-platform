<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>趋势分析 - 自动化巡检与故障诊断平台</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" /><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" /><link href="css/app.css" rel="stylesheet" /></head><body><div id="app-nav"></div><main class="container-fluid app-main"><div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3"><div><h4 class="mb-0"><i class="bi bi-graph-up me-1"></i>趋势分析</h4><div class="text-muted small">网络延迟曲线 · 可用率 SLA · 巡检耗时</div></div><div class="d-flex gap-2 align-items-center"><select class="form-select form-select-sm w-auto" id="asset-select"><option value="">加载中...</option></select><input type="number" class="form-control form-control-sm" id="days-input" value="14" min="1" max="90" style="width:110px" /><button class="btn btn-sm btn-primary" id="btn-refresh"><i class="bi bi-arrow-clockwise me-1"></i>刷新</button></div></div><div id="page-error" class="alert alert-danger d-none" role="alert"></div><div class="row g-3"><div class="col-lg-6"><div class="card h-100"><div class="card-header">响应耗时趋势（ms）</div><div class="card-body d-flex align-items-center"><div id="chart-rtt" class="chart-box w-100" style="height:320px"></div></div></div></div><div class="col-lg-6"><div class="card h-100"><div class="card-header">可用率 SLA（%）</div><div class="card-body d-flex align-items-center"><div id="chart-avail" class="chart-box w-100" style="height:320px"></div></div></div></div><div class="col-12"><div class="card"><div class="card-header">巡检运行耗时（秒）</div><div class="card-body"><div id="chart-duration" class="chart-box w-100" style="height:300px"></div></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/trends.js"></script></body></html>
