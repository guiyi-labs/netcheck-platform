<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>仪表盘 - 自动化巡检与故障诊断平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app-nav"></div>

    <main class="container-fluid app-main">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <div>
          <h4 class="mb-0"><i class="bi bi-speedometer2 me-1"></i>仪表盘</h4>
          <div class="text-muted small">自动化巡检与故障诊断运行概览</div>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-2">
          <span class="text-muted small" id="dashboard-updated">--</span>
          <button class="btn btn-outline-secondary btn-sm" id="btn-dashboard-refresh" type="button">
            <i class="bi bi-arrow-clockwise me-1"></i>刷新
          </button>
        </div>
      </div>

      <div id="dashboard-error" class="alert alert-danger d-none" role="alert"></div>

      <div class="row g-3 dashboard-stats">
        <div class="col-6 col-lg-3 col-xxl">
          <div class="stat-card"><div class="stat-icon"><i class="bi bi-hdd-stack"></i></div><div><div class="stat-label">资产总数</div><div class="stat-value" id="stat-asset-total">--</div></div></div>
        </div>
        <div class="col-6 col-lg-3 col-xxl">
          <div class="stat-card"><div class="stat-icon"><i class="bi bi-check-circle"></i></div><div><div class="stat-label">在线资产</div><div class="stat-value text-success" id="stat-online-assets">--</div></div></div>
        </div>
        <div class="col-6 col-lg-3 col-xxl">
          <div class="stat-card"><div class="stat-icon"><i class="bi bi-x-circle"></i></div><div><div class="stat-label">离线资产</div><div class="stat-value text-danger" id="stat-offline-assets">--</div></div></div>
        </div>
        <div class="col-6 col-lg-3 col-xxl">
          <div class="stat-card"><div class="stat-icon"><i class="bi bi-exclamation-triangle"></i></div><div><div class="stat-label">告警资产</div><div class="stat-value text-warning-emphasis" id="stat-warning-assets">--</div></div></div>
        </div>
        <div class="col-6 col-lg-3 col-xxl">
          <div class="stat-card"><div class="stat-icon"><i class="bi bi-question-circle"></i></div><div><div class="stat-label">未知资产</div><div class="stat-value" id="stat-unknown-assets">--</div></div></div>
        </div>
        <div class="col-6 col-lg-3 col-xxl">
          <div class="stat-card"><div class="stat-icon"><i class="bi bi-clipboard2-pulse"></i></div><div><div class="stat-label">任务总数</div><div class="stat-value" id="stat-task-total">--</div></div></div>
        </div>
        <div class="col-6 col-lg-3 col-xxl">
          <div class="stat-card"><div class="stat-icon"><i class="bi bi-play-circle"></i></div><div><div class="stat-label">运行总数</div><div class="stat-value" id="stat-run-total">--</div></div></div>
        </div>
        <div class="col-6 col-lg-3 col-xxl">
          <div class="stat-card"><div class="stat-icon"><i class="bi bi-calendar-check"></i></div><div><div class="stat-label">今日运行</div><div class="stat-value" id="stat-today-runs">--</div></div></div>
        </div>
        <div class="col-6 col-lg-3 col-xxl">
          <div class="stat-card"><div class="stat-icon"><i class="bi bi-activity"></i></div><div><div class="stat-label">今日异常</div><div class="stat-value text-danger" id="stat-today-abnormal-results">--</div></div></div>
        </div>
        <div class="col-6 col-lg-3 col-xxl">
          <div class="stat-card"><div class="stat-icon"><i class="bi bi-tools"></i></div><div><div class="stat-label">诊断总数</div><div class="stat-value" id="stat-diagnosis-total">--</div></div></div>
        </div>
        <div class="col-6 col-lg-3 col-xxl">
          <div class="stat-card"><div class="stat-icon alert-stat-active"><i class="bi bi-exclamation-triangle"></i></div><div><div class="stat-label">活跃告警</div><div class="stat-value text-danger" id="stat-active-alerts">--</div></div></div>
        </div>
        <div class="col-6 col-lg-3 col-xxl">
          <div class="stat-card"><div class="stat-icon alert-stat-unconfirmed"><i class="bi bi-bell"></i></div><div><div class="stat-label">未确认告警</div><div class="stat-value text-warning-emphasis" id="stat-unconfirmed-alerts">--</div></div></div>
        </div>
        <div class="col-6 col-lg-3 col-xxl">
          <div class="stat-card"><div class="stat-icon alert-stat-recovered"><i class="bi bi-check2-circle"></i></div><div><div class="stat-label">今日恢复</div><div class="stat-value text-success" id="stat-recovered-alerts-today">--</div></div></div>
        </div>
      </div>

      <div class="row g-3 mt-1">
        <div class="col-12 col-xl-4">
          <div class="card dashboard-card h-100"><div class="card-header">资产状态分布</div><div class="card-body"><div id="asset-status-chart" class="chart-box"></div><div id="asset-status-fallback" class="chart-fallback d-none"></div></div></div>
        </div>
        <div class="col-12 col-xl-8">
          <div class="card dashboard-card h-100"><div class="card-header">最近 7 天巡检 / 异常趋势</div><div class="card-body"><div id="trend-chart" class="chart-box"></div><div id="trend-fallback" class="chart-fallback d-none"></div></div></div>
        </div>
        <div class="col-12 col-xl-4">
          <div class="card dashboard-card h-100"><div class="card-header">故障类型分布</div><div class="card-body"><div id="fault-types-chart" class="chart-box"></div><div id="fault-types-fallback" class="chart-fallback d-none"></div></div></div>
        </div>
        <div class="col-12 col-xl-8">
          <div class="card dashboard-card h-100">
            <div class="card-header d-flex justify-content-between align-items-center"><span>最近异常</span><a href="results.html?status=failed" class="small">查看全部</a></div>
            <div class="card-body">
              <div class="table-responsive dashboard-table-wrap">
                <table class="table table-hover align-middle mb-0 dashboard-table">
                  <thead><tr><th>时间</th><th>任务</th><th>资产</th><th>类型</th><th>目标</th><th>状态</th><th>消息 / 错误</th><th class="text-end">操作</th></tr></thead>
                  <tbody id="recent-abnormal-tbody"><tr><td colspan="8" class="text-center text-muted py-4">加载中...</td></tr></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
