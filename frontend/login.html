<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - 自动化巡检与故障诊断平台</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/app.css" rel="stylesheet" />
  </head>
  <body class="login-body">
    <div class="login-wrapper">
      <div class="login-card">
        <div class="login-brand">
          <i class="bi bi-hdd-network"></i>
          <h1>自动化巡检与故障诊断平台</h1>
          <p>网络资产台账闭环 · 管理后台</p>
        </div>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="username">用户名</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                autocomplete="username"
                placeholder="请输入用户名"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">密码</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="请输入密码"
                required
              />
            </div>
          </div>

          <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

          <button type="submit" class="btn btn-primary w-100" id="login-btn">
            <span class="spinner-border spinner-border-sm me-1 d-none" id="login-spin" role="status" aria-hidden="true"></span>
            <span id="login-btn-text">登录</span>
          </button>
        </form>

        <div class="login-hint">默认演示账号：admin / admin123</div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>
      // 登录页逻辑：默认填入演示账号，提交调用 /api/auth/login
      (function () {
        // 默认填入演示账号方便演示
        document.getElementById('username').value = 'admin';
        document.getElementById('password').value = 'admin123';

        var form = document.getElementById('login-form');
        var errBox = document.getElementById('login-error');
        var btn = document.getElementById('login-btn');
        var spin = document.getElementById('login-spin');
        var btnText = document.getElementById('login-btn-text');

        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          errBox.classList.add('d-none');
          errBox.textContent = '';

          var username = document.getElementById('username').value.trim();
          var password = document.getElementById('password').value;

          if (!username || !password) {
            errBox.textContent = '请输入用户名和密码';
            errBox.classList.remove('d-none');
            return;
          }

          btn.disabled = true;
          spin.classList.remove('d-none');
          btnText.textContent = '登录中...';

          try {
            var data = await api.post('/api/auth/login', {
              username: username,
              password: password,
            });
            // 存 token 与用户信息后跳转主页
            localStorage.setItem('netcheck_token', data.token);
            localStorage.setItem('netcheck_user', JSON.stringify(data.user || {}));
            location.href = 'index.html';
          } catch (err) {
            errBox.textContent = err.message || '登录失败，请重试';
            errBox.classList.remove('d-none');
          } finally {
            btn.disabled = false;
            spin.classList.add('d-none');
            btnText.textContent = '登录';
          }
        });
      })();
    </script>
  </body>
</html>
