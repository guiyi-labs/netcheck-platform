<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>资产管理 - 自动化巡检与故障诊断平台</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/app.css" rel="stylesheet" />
  </head>
  <body>
    <!-- 顶部导航栏（由 auth.js 渲染） -->
    <div id="app-nav"></div>

    <main class="container-fluid app-main">
      <div class="d-flex flex-wrap align-items-center justify-content-between mb-3">
        <h4 class="mb-0"><i class="bi bi-hdd-stack me-1"></i>资产管理</h4>
        <button class="btn btn-primary btn-sm" id="btn-create">
          <i class="bi bi-plus-lg me-1"></i>新增资产
        </button>
      </div>

      <!-- 筛选表单 -->
      <div class="card filter-card mb-3">
        <div class="card-body">
          <form id="filter-form" class="row g-2 align-items-end" novalidate>
            <div class="col-12 col-md-2">
              <label class="form-label" for="f-name">名称</label>
              <input type="text" class="form-control" id="f-name" placeholder="名称模糊" />
            </div>
            <div class="col-12 col-md-2">
              <label class="form-label" for="f-ip">IP</label>
              <input type="text" class="form-control" id="f-ip" placeholder="IP 模糊" />
            </div>
            <div class="col-12 col-md-2">
              <label class="form-label" for="f-type">资产类型</label>
              <select class="form-select" id="f-type"></select>
            </div>
            <div class="col-12 col-md-2">
              <label class="form-label" for="f-location">区域</label>
              <select class="form-select" id="f-location"></select>
            </div>
            <div class="col-12 col-md-2">
              <label class="form-label" for="f-status">状态</label>
              <select class="form-select" id="f-status"></select>
            </div>
            <div class="col-12 col-md-2 d-flex gap-2">
              <button type="submit" class="btn btn-primary flex-fill" id="btn-query">
                <i class="bi bi-search me-1"></i>查询
              </button>
              <button type="button" class="btn btn-outline-secondary flex-fill" id="btn-reset">
                重置
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- 资产表格 -->
      <div class="card">
        <div class="card-body">
          <!-- 错误提示 -->
          <div id="list-error" class="alert alert-danger d-none" role="alert"></div>

          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>名称</th>
                  <th>IP</th>
                  <th>类型</th>
                  <th>区域</th>
                  <th>端口</th>
                  <th>负责人</th>
                  <th>状态</th>
                  <th class="text-end">操作</th>
                </tr>
              </thead>
              <tbody id="asset-tbody">
                <tr>
                  <td colspan="9" class="text-center text-muted py-4">加载中...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- 分页 -->
          <div class="pagination-bar mt-3">
            <div class="text-muted small" id="page-info">共 0 条</div>
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn btn-outline-secondary" id="btn-prev" disabled>
                <i class="bi bi-chevron-left"></i> 上一页
              </button>
              <button type="button" class="btn btn-outline-secondary" id="btn-next" disabled>
                下一页 <i class="bi bi-chevron-right"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 新增/编辑资产模态框 -->
    <div class="modal fade" id="assetModal" tabindex="-1" aria-labelledby="assetModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <form id="asset-form" class="modal-form" novalidate>
            <div class="modal-header">
              <h5 class="modal-title" id="assetModalLabel">新增资产</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
              <div id="form-error" class="alert alert-danger d-none" role="alert"></div>
              <input type="hidden" id="f-id" />
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="m-name">名称<span class="required-mark">*</span></label>
                  <input type="text" class="form-control" id="m-name" maxlength="128" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="m-ip">IP<span class="required-mark">*</span></label>
                  <input type="text" class="form-control" id="m-ip" maxlength="64" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="m-hostname">主机名</label>
                  <input type="text" class="form-control" id="m-hostname" maxlength="128" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="m-type">资产类型<span class="required-mark">*</span></label>
                  <select class="form-select" id="m-type" required></select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="m-location">区域</label>
                  <select class="form-select" id="m-location"></select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="m-os">操作系统</label>
                  <input type="text" class="form-control" id="m-os" maxlength="64" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="m-business">业务名称</label>
                  <input type="text" class="form-control" id="m-business" maxlength="128" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="m-ports">端口</label>
                  <input type="text" class="form-control" id="m-ports" maxlength="255" placeholder="如 22,80,443" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="m-owner">负责人</label>
                  <input type="text" class="form-control" id="m-owner" maxlength="64" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="m-status">状态<span class="required-mark">*</span></label>
                  <select class="form-select" id="m-status" required></select>
                </div>
                <div class="col-12">
                  <label class="form-label" for="m-remark">备注</label>
                  <textarea class="form-control" id="m-remark" rows="2" maxlength="500"></textarea>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
              <button type="submit" class="btn btn-primary" id="btn-save">
                <span class="spinner-border spinner-border-sm me-1 d-none" id="save-spin" role="status" aria-hidden="true"></span>
                <span id="save-text">保存</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      // 资产管理页：筛选 / 列表 / 新增 / 编辑 / 删除 / 分页
      (function () {
        if (!Auth.requireAuth()) {
          return;
        }
        Auth.renderNav('app-nav');

        // ---- 常量（与后端契约一致） ----
        var ASSET_TYPES = [
          { value: 'server', label: '服务器' },
          { value: 'network_device', label: '网络设备' },
          { value: 'web_service', label: 'Web服务' },
          { value: 'database_service', label: '数据库服务' },
          { value: 'middleware', label: '中间件' },
          { value: 'terminal', label: '终端' },
          { value: 'container', label: '容器' },
        ];
        var STATUSES = [
          { value: 'online', label: '在线' },
          { value: 'offline', label: '离线' },
          { value: 'warning', label: '警告' },
          { value: 'unknown', label: '未知' },
        ];
        // 区域为可选自由字段，此处提供常见选项便于筛选；后端无 meta 接口
        var LOCATIONS = [
          '北京机房', '上海机房', '广州机房', '深圳机房',
          '成都机房', '武汉机房', '西安机房', '南京机房', '杭州机房',
        ];

        var TYPE_LABELS = {};
        ASSET_TYPES.forEach(function (t) { TYPE_LABELS[t.value] = t.label; });
        var STATUS_LABELS = {};
        STATUSES.forEach(function (s) { STATUS_LABELS[s.value] = s.label; });

        function statusClass(status) {
          return {
            online: 'status-online',
            offline: 'status-offline',
            warning: 'status-warning',
            unknown: 'status-unknown',
          }[status] || 'status-unknown';
        }

        function escapeHtml(s) {
          if (s === undefined || s === null) return '';
          return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function typeLabel(v) { return TYPE_LABELS[v] || escapeHtml(v) || '-'; }
        function statusLabel(v) { return STATUS_LABELS[v] || escapeHtml(v) || '-'; }

        // ---- 填充筛选下拉 ----
        function fillFilterSelects() {
          fillSelect('f-type', ASSET_TYPES, '全部', '');
          fillSelect('f-location', LOCATIONS.map(function (l) { return { value: l, label: l }; }), '全部', '');
          fillSelect('f-status', STATUSES, '全部', '');
        }
        // 填充模态框下拉
        function fillModalSelects() {
          fillSelect('m-type', ASSET_TYPES, '请选择', '');
          fillSelect('m-location', LOCATIONS.map(function (l) { return { value: l, label: l }; }), '不指定', '');
          fillSelect('m-status', STATUSES, '请选择', '');
        }
        function fillSelect(id, options, placeholderText, placeholderValue) {
          var sel = document.getElementById(id);
          var html = '<option value="' + escapeHtml(placeholderValue) + '">' + escapeHtml(placeholderText) + '</option>';
          options.forEach(function (o) {
            html += '<option value="' + escapeHtml(o.value) + '">' + escapeHtml(o.label) + '</option>';
          });
          sel.innerHTML = html;
        }

        fillFilterSelects();
        fillModalSelects();

        // ---- 状态 ----
        var state = {
          query: { name: '', ip: '', asset_type: '', location: '', status: '' },
          page: 1,
          page_size: 20,
          total: 0,
          items: [],
        };

        // ---- DOM 引用 ----
        var tbody = document.getElementById('asset-tbody');
        var listError = document.getElementById('list-error');
        var pageInfo = document.getElementById('page-info');
        var btnPrev = document.getElementById('btn-prev');
        var btnNext = document.getElementById('btn-next');
        var btnCreate = document.getElementById('btn-create');
        var filterForm = document.getElementById('filter-form');
        var btnReset = document.getElementById('btn-reset');
        var assetForm = document.getElementById('asset-form');
        var formError = document.getElementById('form-error');
        var btnSave = document.getElementById('btn-save');
        var saveSpin = document.getElementById('save-spin');
        var saveText = document.getElementById('save-text');
        var modalEl = document.getElementById('assetModal');
        var assetModal = new bootstrap.Modal(modalEl);

        function showListError(msg) {
          listError.textContent = msg;
          listError.classList.remove('d-none');
        }
        function hideListError() {
          listError.classList.add('d-none');
          listError.textContent = '';
        }
        function showFormError(msg) {
          formError.textContent = msg;
          formError.classList.remove('d-none');
        }
        function hideFormError() {
          formError.classList.add('d-none');
          formError.textContent = '';
        }

        // ---- 加载列表 ----
        async function loadList() {
          hideListError();
          tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">加载中...</td></tr>';
          btnPrev.disabled = true;
          btnNext.disabled = true;

          // 组装查询参数
          var q = state.query;
          var params = new URLSearchParams();
          params.set('page', state.page);
          params.set('page_size', state.page_size);
          if (q.name) params.set('name', q.name);
          if (q.ip) params.set('ip', q.ip);
          if (q.asset_type) params.set('asset_type', q.asset_type);
          if (q.location) params.set('location', q.location);
          if (q.status) params.set('status', q.status);

          try {
            var data = await api.get('/api/assets?' + params.toString());
            var total = (data && typeof data.total === 'number') ? data.total : 0;
            var items = (data && data.items) ? data.items : [];
            state.total = total;
            state.items = items;
            renderTable(items);
            renderPagination();
          } catch (err) {
            state.total = 0;
            state.items = [];
            tbody.innerHTML = '';
            showListError('加载资产列表失败：' + err.message);
            renderPagination();
          }
        }

        function renderTable(items) {
          if (!items || items.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="9" class="empty-state">' +
              '<i class="bi bi-inbox"></i><div>暂无资产数据</div>' +
              '</td></tr>';
            return;
          }
          var html = '';
          items.forEach(function (it) {
            var st = it.status || 'unknown';
            html +=
              '<tr>' +
              '<td>' + escapeHtml(it.id) + '</td>' +
              '<td>' + escapeHtml(it.name) + '</td>' +
              '<td>' + escapeHtml(it.ip) + '</td>' +
              '<td>' + typeLabel(it.asset_type) + '</td>' +
              '<td>' + escapeHtml(it.location || '-') + '</td>' +
              '<td>' + escapeHtml(it.ports || '-') + '</td>' +
              '<td>' + escapeHtml(it.owner || '-') + '</td>' +
              '<td><span class="status-badge ' + statusClass(st) + '">' + statusLabel(st) + '</span></td>' +
              '<td class="text-end text-nowrap">' +
                '<button class="btn btn-sm btn-outline-primary btn-icon me-1 js-edit" data-id="' + escapeHtml(it.id) + '" title="编辑"><i class="bi bi-pencil"></i></button>' +
                '<button class="btn btn-sm btn-outline-danger btn-icon js-del" data-id="' + escapeHtml(it.id) + '" title="删除"><i class="bi bi-trash"></i></button>' +
              '</td>' +
              '</tr>';
          });
          tbody.innerHTML = html;
        }

        function renderPagination() {
          var total = state.total;
          var totalPages = total === 0 ? 0 : Math.ceil(total / state.page_size);
          if (totalPages < 1) totalPages = 1;
          pageInfo.textContent = '共 ' + total + ' 条 | 第 ' + state.page + '/' + totalPages + ' 页';
          btnPrev.disabled = state.page <= 1;
          btnNext.disabled = state.page >= totalPages || total === 0;
        }

        // ---- 事件：查询 / 重置 / 翻页 ----
        filterForm.addEventListener('submit', function (e) {
          e.preventDefault();
          state.query.name = document.getElementById('f-name').value.trim();
          state.query.ip = document.getElementById('f-ip').value.trim();
          state.query.asset_type = document.getElementById('f-type').value;
          state.query.location = document.getElementById('f-location').value;
          state.query.status = document.getElementById('f-status').value;
          state.page = 1;
          loadList();
        });

        btnReset.addEventListener('click', function () {
          document.getElementById('f-name').value = '';
          document.getElementById('f-ip').value = '';
          document.getElementById('f-type').value = '';
          document.getElementById('f-location').value = '';
          document.getElementById('f-status').value = '';
          state.query = { name: '', ip: '', asset_type: '', location: '', status: '' };
          state.page = 1;
          loadList();
        });

        btnPrev.addEventListener('click', function () {
          if (state.page > 1) {
            state.page--;
            loadList();
          }
        });
        btnNext.addEventListener('click', function () {
          var totalPages = state.total === 0 ? 0 : Math.ceil(state.total / state.page_size);
          if (totalPages < 1) totalPages = 1;
          if (state.page < totalPages) {
            state.page++;
            loadList();
          }
        });

        // ---- 事件：编辑 / 删除（事件委托） ----
        tbody.addEventListener('click', function (e) {
          var editBtn = e.target.closest('.js-edit');
          var delBtn = e.target.closest('.js-del');
          if (editBtn) {
            openEditModal(editBtn.getAttribute('data-id'));
          } else if (delBtn) {
            handleDelete(delBtn.getAttribute('data-id'));
          }
        });

        function findItem(id) {
          var target = String(id);
          for (var i = 0; i < state.items.length; i++) {
            if (String(state.items[i].id) === target) return state.items[i];
          }
          return null;
        }

        // ---- 新增 / 编辑模态框 ----
        btnCreate.addEventListener('click', function () {
          openCreateModal();
        });

        function openCreateModal() {
          assetForm.reset();
          document.getElementById('f-id').value = '';
          document.getElementById('assetModalLabel').textContent = '新增资产';
          saveText.textContent = '新增';
          // 默认状态：未知
          document.getElementById('m-status').value = 'unknown';
          hideFormError();
          assetModal.show();
        }

        function openEditModal(id) {
          var item = findItem(id);
          if (!item) {
            showListError('未找到该资产，请刷新列表后重试');
            return;
          }
          assetForm.reset();
          document.getElementById('f-id').value = item.id;
          document.getElementById('m-name').value = item.name || '';
          document.getElementById('m-ip').value = item.ip || '';
          document.getElementById('m-hostname').value = item.hostname || '';
          document.getElementById('m-type').value = item.asset_type || '';
          document.getElementById('m-location').value = item.location || '';
          document.getElementById('m-os').value = item.os_type || '';
          document.getElementById('m-business').value = item.business_name || '';
          document.getElementById('m-ports').value = item.ports || '';
          document.getElementById('m-owner').value = item.owner || '';
          document.getElementById('m-status').value = item.status || '';
          document.getElementById('m-remark').value = item.remark || '';
          document.getElementById('assetModalLabel').textContent = '编辑资产';
          saveText.textContent = '保存';
          hideFormError();
          assetModal.show();
        }

        // 收集表单数据
        function collectForm() {
          return {
            name: document.getElementById('m-name').value.trim(),
            ip: document.getElementById('m-ip').value.trim(),
            hostname: document.getElementById('m-hostname').value.trim() || null,
            asset_type: document.getElementById('m-type').value,
            location: document.getElementById('m-location').value || null,
            os_type: document.getElementById('m-os').value.trim() || null,
            business_name: document.getElementById('m-business').value.trim() || null,
            ports: document.getElementById('m-ports').value.trim() || null,
            owner: document.getElementById('m-owner').value.trim() || null,
            status: document.getElementById('m-status').value,
            remark: document.getElementById('m-remark').value.trim() || null,
          };
        }

        assetForm.addEventListener('submit', async function (e) {
          e.preventDefault();
          hideFormError();
          var body = collectForm();

          // 表单校验：name 和 ip 必填
          if (!body.name) {
            showFormError('请填写资产名称');
            return;
          }
          if (!body.ip) {
            showFormError('请填写 IP 地址');
            return;
          }
          if (!body.asset_type) {
            showFormError('请选择资产类型');
            return;
          }
          if (!body.status) {
            showFormError('请选择状态');
            return;
          }

          var id = document.getElementById('f-id').value;
          var isEdit = !!id;
          btnSave.disabled = true;
          saveSpin.classList.remove('d-none');
          saveText.textContent = '保存中...';
          try {
            if (isEdit) {
              await api.put('/api/assets/' + encodeURIComponent(id), body);
            } else {
              await api.post('/api/assets', body);
            }
            assetModal.hide();
            // 新增后回到第 1 页；编辑后刷新当前页
            if (!isEdit) state.page = 1;
            loadList();
          } catch (err) {
            showFormError(err.message || '保存失败，请重试');
          } finally {
            btnSave.disabled = false;
            saveSpin.classList.add('d-none');
            saveText.textContent = isEdit ? '保存' : '新增';
          }
        });

        // 模态框关闭后重置按钮文案
        modalEl.addEventListener('hidden.bs.modal', function () {
          hideFormError();
          saveText.textContent = '保存';
          saveSpin.classList.add('d-none');
          btnSave.disabled = false;
        });

        // ---- 删除 ----
        async function handleDelete(id) {
          var item = findItem(id);
          var tip = item ? ('确定删除资产「' + (item.name || item.ip) + '」吗？') : '确定删除该资产吗？';
          if (!window.confirm(tip)) return;
          hideListError();
          try {
            await api.del('/api/assets/' + encodeURIComponent(id));
            // 若删除后当前页为空且非第 1 页，回退一页
            if (state.items.length <= 1 && state.page > 1) {
              state.page--;
            }
            loadList();
          } catch (err) {
            showListError('删除失败：' + err.message);
          }
        }

        // 初始加载
        loadList();
      })();
    </script>
  </body>
</html>
